<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team-Cockpit</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <h1>Team-Cockpit</h1>
    <div class="chips" id="attention" aria-live="polite"></div>
    <span class="conn" id="conn" title="Verbindung zum Service">verbinde …</span>
  </header>

  <main>
    <section id="attention-section" aria-labelledby="h-attn">
      <h2 id="h-attn">Wartet auf dich</h2>
      <p class="quiet" id="attention-empty" hidden>Alles ruhig.</p>
      <div class="cards" id="attention-list"></div>
    </section>

    <section id="agents-section" aria-labelledby="h-agents">
      <h2 id="h-agents">Agenten</h2>
      <div class="agents" id="agents"></div>
    </section>

    <section aria-labelledby="h-tasks">
      <h2 id="h-tasks">Aufträge</h2>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Filter"></nav>
      <div class="table-wrap">
        <table class="tasks-table">
          <thead>
            <tr><th>#</th><th>Agent</th><th>Auftrag</th><th>Projekt</th><th>Status</th><th>Aktualisiert</th></tr>
          </thead>
          <tbody id="tasks"></tbody>
        </table>
      </div>
      <p class="empty" id="tasks-empty" hidden>Keine Aufträge in dieser Ansicht.</p>
    </section>

    <section aria-labelledby="h-sessions">
      <h2 id="h-sessions">Sessions <span class="count" id="sessions-count"></span></h2>
      <div class="table-wrap">
        <table class="sessions-table">
          <thead>
            <tr><th>Projekt</th><th>Status</th><th>Gestartet</th><th>Zuletzt</th><th>Auftrag</th></tr>
          </thead>
          <tbody id="sessions"></tbody>
        </table>
      </div>
      <p class="empty" id="sessions-empty" hidden>Noch keine Session gesehen. Eine Session erscheint mit ihrem ersten Prompt oder Tool-Aufruf.</p>
    </section>
  </main>

  <dialog id="detail" aria-labelledby="d-title">
    <article>
      <header>
        <h3 id="d-title"></h3>
        <button type="button" class="ghost" id="d-close" aria-label="Schließen">Schließen</button>
      </header>
      <div id="d-body"></div>
      <p class="error" id="d-error" role="alert" hidden></p>
      <div class="actions" id="d-actions"></div>
    </article>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
